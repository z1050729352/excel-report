server {
    listen 80;
    listen 443 ssl;
    server_name 你的域名.com;

    # SSL 证书（阿里云申请免费证书后填这里）
    # ssl_certificate     /etc/nginx/ssl/你的域名.pem;
    # ssl_certificate_key /etc/nginx/ssl/你的域名.key;

    # HTTP 强制跳 HTTPS（SSL 配好后取消注释）
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    charset utf-8;

    # ─────────────────────────────────────────────
    # /game  → 静态 H5 小游戏
    # ─────────────────────────────────────────────
    location /game/ {
        alias /var/www/game/;
        index index.html;
        try_files $uri $uri/ /game/index.html;
    }

    # ─────────────────────────────────────────────
    # /smoking  → 烟草系统前端
    # ─────────────────────────────────────────────
    location /smoking/ {
        alias /var/www/smoking/;
        index index.html;
        # SPA fallback：所有子路由都返回 index.html
        try_files $uri $uri/ /smoking/index.html;
    }

    # admin.html 单独入口（hash路由，不需要 fallback）
    location = /smoking/admin.html {
        alias /var/www/smoking/admin.html;
    }

    # ─────────────────────────────────────────────
    # /api  → 反代到 Node 后端 (3001)
    # ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 上传文件大小限制（Excel 一般不超过 20MB）
        client_max_body_size 20m;
    }

    # 根路径可以放个导航页，或直接跳 /smoking
    location = / {
        return 302 /smoking/;
    }
}
