version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tobacco-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: tobacco_order
      MYSQL_USER: tobacco
      MYSQL_PASSWORD: tobacco123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"  # 本地3307端口映射，避免冲突
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
